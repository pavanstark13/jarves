# Jarves — gold trading agent.
#
# The backend keeps its state in SQLite inside the `agent-data` volume, so
# there is no database service to run. Copy backend/.env.example to
# backend/.env and fill in the OANDA credentials before starting.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/jarves.db
    volumes:
      - ./backend:/app
      - agent-data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  agent-data:
